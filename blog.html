<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - João Muconto</title>
    
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; 
                   style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data: https:; 
                   connect-src 'self';">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --gradient: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #f7f9fc;
            scroll-behavior: smooth;
        }

        .gradient-text {
            background-image: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .article-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .article-card:hover .read-more {
            color: #667eea;
        }

        .read-more {
            transition: all 0.3s ease;
        }

        .article-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            line-height: 1.2;
        }

        .article-content h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem;
            line-height: 1.3;
        }

        .article-content h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 1.25rem 0 0.5rem;
            line-height: 1.4;
        }

        .article-content p {
            margin: 1rem 0;
            line-height: 1.8;
            color: #374151;
        }

        .article-content ul, 
        .article-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .article-content li {
            margin: 0.5rem 0;
            line-height: 1.7;
        }

        .article-content blockquote {
            border-left: 4px solid #667eea;
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .article-content code {
            background: #f1f3f5;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .article-content pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }

        .article-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .article-content .article-meta {
            color: #6b7280;
            font-size: 0.95rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .article-content .article-meta span {
            margin-right: 1.5rem;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .back-btn {
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateX(-4px);
        }

        .tag {
            transition: all 0.2s ease;
        }

        .tag:hover {
            background: var(--gradient);
            color: white;
        }

        .home-link:hover {
            transform: translateX(-2px);
        }

        .cta-button {
            background: var(--gradient);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        @media (max-width: 768px) {
            .article-content h1 {
                font-size: 2rem;
            }
            .article-content h2 {
                font-size: 1.5rem;
            }
            .article-content h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold gradient-text home-link flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Blog
            </a>
            <nav class="flex items-center gap-6">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600 transition text-sm font-medium">Home</a>
                <a href="blog.html" class="text-indigo-600 font-medium text-sm">Blog</a>
                <a href="cv.html" class="text-gray-600 hover:text-indigo-600 transition text-sm font-medium">CV</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12">
        
        <!-- Blog Header -->
        <div class="mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">Blog</h1>
            <p class="text-gray-600 text-lg">Articles about this project, software engineering, and technology.</p>
        </div>

        <!-- Loading Skeleton -->
        <div id="skeleton-loader" class="space-y-8">
            <div class="skeleton h-32 w-full"></div>
            <div class="skeleton h-32 w-full"></div>
            <div class="skeleton h-32 w-full"></div>
        </div>

        <!-- Blog Container -->
        <div id="blog-container"></div>

        <!-- Article View (hidden by default) -->
        <div id="article-view" class="hidden">
            <button onclick="goBackToIndex()" class="back-btn inline-flex items-center gap-2 text-gray-600 hover:text-indigo-600 mb-8 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to all articles
            </button>
            <div id="article-content" class="article-content"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-8 bg-gray-800 text-center text-gray-400 mt-12">
        <p class="text-sm">&copy; <span id="currentYear"></span> João Muconto.</p>
        <p class="text-xs mt-1 text-gray-500">Built with ❤️ and vanilla JS</p>
        <div class="mt-4 flex justify-center gap-6 text-xs">
            <a href="index.html" class="text-gray-400 hover:text-white transition">Home</a>
            <a href="blog.html" class="text-gray-400 hover:text-white transition">Blog</a>
            <a href="cv.html" class="text-gray-400 hover:text-white transition">CV</a>
            <a href="https://github.com/jmuconto/resume" target="_blank" class="text-gray-400 hover:text-white transition">GitHub</a>
        </div>
    </footer>

    <script>
        // ═══════════════════════════════════════════════════════
        // BLOG CONFIGURATION
        // ═══════════════════════════════════════════════════════

        const BLOG_CONFIG = {
            articlesPath: 'blog/',
            snippetLength: 200,
            cacheKey: 'blog_articles_cache',
            cacheTTL: 3600000
        };

        // ═══════════════════════════════════════════════════════
        // CACHE
        // ═══════════════════════════════════════════════════════

        function getCachedArticles() {
            try {
                const cached = sessionStorage.getItem(BLOG_CONFIG.cacheKey);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < BLOG_CONFIG.cacheTTL) {
                        return parsed.data;
                    }
                }
            } catch (e) {}
            return null;
        }

        function cacheArticles(data) {
            try {
                sessionStorage.setItem(BLOG_CONFIG.cacheKey, JSON.stringify({
                    data: data,
                    timestamp: Date.now()
                }));
            } catch (e) {}
        }

        // ═══════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════

        function extractSnippet(content, length = 200) {
            const plainText = content.replace(/[#*`]/g, '').trim();
            if (plainText.length <= length) return plainText;
            return plainText.substring(0, length) + '...';
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return null;
            return date;
        }

        function formatDate(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function slugify(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // ═══════════════════════════════════════════════════════
        // RENDER FUNCTIONS
        // ═══════════════════════════════════════════════════════

        function renderArticleIndex(articles) {
            const container = document.getElementById('blog-container');
            const skeleton = document.getElementById('skeleton-loader');
            
            if (skeleton) skeleton.style.display = 'none';

            if (!articles || articles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <p class="text-gray-500 text-lg">No articles found.</p>
                        <p class="text-gray-400 text-sm mt-2">Check back later for new content.</p>
                        <a href="index.html" class="inline-block mt-6 text-indigo-600 hover:underline">← Return to homepage</a>
                    </div>
                `;
                return;
            }

            const sorted = [...articles].sort((a, b) => {
                const dateA = parseDate(a.date);
                const dateB = parseDate(b.date);
                if (!dateA && !dateB) return 0;
                if (!dateA) return 1;
                if (!dateB) return -1;
                return dateB - dateA;
            });

            container.innerHTML = `
                <div class="space-y-8">
                    ${sorted.map(article => `
                        <article class="article-card bg-white rounded-xl p-6 md:p-8 shadow-sm hover:shadow-lg transition-all">
                            <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
                                <h2 class="text-xl md:text-2xl font-semibold text-gray-800 hover:text-indigo-600 transition">
                                    ${article.title}
                                </h2>
                                ${article.date ? `
                                    <span class="text-sm text-gray-400 whitespace-nowrap">
                                        ${formatDate(parseDate(article.date))}
                                    </span>
                                ` : ''}
                            </div>
                            
                            ${article.tags && article.tags.length > 0 ? `
                                <div class="flex flex-wrap gap-2 mb-3">
                                    ${article.tags.map(tag => `
                                        <span class="tag text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">
                                            #${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            <p class="text-gray-600 leading-relaxed mb-4">
                                ${extractSnippet(article.body, BLOG_CONFIG.snippetLength)}
                            </p>
                            
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <span class="text-sm text-gray-400">
                                    ${article.readingTime || Math.max(1, Math.round(article.body.split(/\s+/).length / 200))} min read
                                </span>
                                <button onclick="openArticle('${slugify(article.title)}')" 
                                        class="read-more text-indigo-600 font-medium hover:text-indigo-800 transition inline-flex items-center gap-1">
                                    Read more
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                    </svg>
                                </button>
                            </div>
                        </article>
                    `).join('')}
                </div>
            `;
        }

        function renderArticle(article) {
            const container = document.getElementById('blog-container');
            const articleView = document.getElementById('article-view');
            const articleContent = document.getElementById('article-content');
            const skeleton = document.getElementById('skeleton-loader');

            if (skeleton) skeleton.style.display = 'none';
            if (container) container.style.display = 'none';
            articleView.classList.remove('hidden');

            let html = article.body;

            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Bold and Italic
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Code blocks
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Blockquotes
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-600 hover:underline">$1</a>');

            // Lists
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^(\d+)\. (.*$)/gim, '<li>$2</li>');
            html = html.replace(/(<li>.*?<\/li>)+/gs, (match) => {
                if (match.includes('<li>')) {
                    return `<ul>${match}</ul>`;
                }
                return match;
            });

            // Paragraphs
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';

            // Clean up
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(\s*)<h/g, '<h');
            html = html.replace(/<\/h(\d)><\/p>/g, '</h$1>');

            // Build full article HTML
            articleContent.innerHTML = `
                <div class="mb-8">
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">${article.title}</h1>
                    <div class="article-meta flex flex-wrap items-center gap-4 text-sm text-gray-500">
                        ${article.author ? `<span>✍️ ${article.author}</span>` : ''}
                        ${article.date ? `<span>📅 ${formatDate(parseDate(article.date))}</span>` : ''}
                        <span>⏱️ ${article.readingTime || Math.max(1, Math.round(article.body.split(/\s+/).length / 200))} min read</span>
                    </div>
                    ${article.tags && article.tags.length > 0 ? `
                        <div class="flex flex-wrap gap-2 mt-4">
                            ${article.tags.map(tag => `
                                <span class="tag text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full">
                                    #${tag}
                                </span>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
                <div>
                    ${html}
                </div>
                ${article.links && article.links.length > 0 ? `
                    <div class="mt-8 pt-6 border-t border-gray-200">
                        <h3 class="text-sm font-semibold text-gray-600 mb-3">🔗 Links</h3>
                        <ul class="space-y-2">
                            ${article.links.map(link => `
                                <li><a href="${link.url}" target="_blank" class="text-indigo-600 hover:underline">${link.label}</a></li>
                            `).join('')}
                        </ul>
                    </div>
                ` : ''}
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (window.history && window.history.pushState) {
                window.history.pushState({ slug: slugify(article.title) }, '', `?article=${slugify(article.title)}`);
            }
        }

        function goBackToIndex() {
            const container = document.getElementById('blog-container');
            const articleView = document.getElementById('article-view');

            articleView.classList.add('hidden');
            container.style.display = 'block';
            
            if (window.history && window.history.pushState) {
                window.history.pushState({}, '', window.location.pathname);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            loadArticles();
        }

        // ═══════════════════════════════════════════════════════
        // ARTICLE LOADING
        // ═══════════════════════════════════════════════════════

        const articleCache = {};

        async function loadArticles() {
            let articles = getCachedArticles();

            if (!articles) {
                try {
                    const response = await fetch(`${BLOG_CONFIG.articlesPath}index.json`);
                    if (response.ok) {
                        articles = await response.json();
                        cacheArticles(articles);
                    } else {
                        articles = [];
                    }
                } catch (error) {
                    console.warn('Failed to load articles:', error);
                    articles = [];
                }
            }

            renderArticleIndex(articles);
            return articles;
        }

        async function loadArticle(slug) {
            if (articleCache[slug]) {
                renderArticle(articleCache[slug]);
                return;
            }

            try {
                const response = await fetch(`${BLOG_CONFIG.articlesPath}${slug}.json`);
                if (response.ok) {
                    const data = await response.json();
                    articleCache[slug] = data;
                    renderArticle(data);
                    return;
                }

                const articles = getCachedArticles() || [];
                const article = articles.find(a => slugify(a.title) === slug);
                if (article) {
                    articleCache[slug] = article;
                    renderArticle(article);
                    return;
                }

                throw new Error('Article not found');
            } catch (error) {
                console.error('Failed to load article:', error);
                const articleContent = document.getElementById('article-content');
                articleContent.innerHTML = `
                    <div class="text-center py-16">
                        <p class="text-gray-500 text-lg">Article not found</p>
                        <button onclick="goBackToIndex()" class="mt-4 text-indigo-600 hover:underline">
                            Return to blog
                        </button>
                    </div>
                `;
            }
        }

        function openArticle(slug) {
            loadArticle(slug);
        }

        // ═══════════════════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            const urlParams = new URLSearchParams(window.location.search);
            const articleSlug = urlParams.get('article');

            if (articleSlug) {
                const container = document.getElementById('blog-container');
                const articleView = document.getElementById('article-view');
                container.style.display = 'none';
                articleView.classList.remove('hidden');
                loadArticle(articleSlug);
            } else {
                loadArticles();
            }

            window.addEventListener('popstate', function() {
                const urlParams = new URLSearchParams(window.location.search);
                const slug = urlParams.get('article');
                if (slug) {
                    loadArticle(slug);
                } else {
                    goBackToIndex();
                }
            });

            window.eval = function() {
                console.warn('⚠️ eval() blocked for security');
                return null;
            };
        });
    </script>

</body>
</html>
