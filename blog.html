    <style>

        :root {
            --primary: #667eea;
            --secondary: #764ba2;

            background-clip: text;

            font-size: 2.5rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            line-height: 1.2;
        }

        .article-content h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem;
            line-height: 1.3;
        }

        .article-content h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 1.25rem 0 0.5rem;
            line-height: 1.4;
        }

        .article-content p {
            margin: 1rem 0;
            line-height: 1.8;
            color: #374151;
        }

        .article-content ul, 
        .article-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .article-content li {
            margin: 0.5rem 0;
            line-height: 1.7;
        }

        .article-content blockquote {
            border-left: 4px solid #667eea;
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .article-content code {
            background: #f1f3f5;
            padding: 0.2rem 0.4rem;

        .article-content pre {

            color: #d4d4d4;

            border-radius: 8px;

        }

        .article-content img {
            max-width: 100%;

            border-radius: 8px;
            margin: 1.5rem 0;

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);

            border-radius: 8px;

        /* Back Button */
        .back-btn {
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateX(-4px);
        }

        /* Tags */
        .tag {
            transition: all 0.2s ease;
        }

        .tag:hover {
            background: var(--gradient);
            color: white;
        }

        /* Responsive Typography */
        @media (max-width: 768px) {
            .article-content h1 {
                font-size: 2rem;
            }
            .article-content h2 {
                font-size: 1.5rem;
            }
            .article-content h3 {
                font-size: 1.2rem;
            }
        }

        /* Home link in header */
        .home-link {
            transition: all 0.3s ease;
        }

        .home-link:hover {
            transform: translateX(-2px);
        }
    </style>
</head>

    <script>
        // ═══════════════════════════════════════════════════════
        // BLOG CONFIGURATION
        // ═══════════════════════════════════════════════════════

        const BLOG_CONFIG = {
            articlesPath: 'blog/',      // Folder where articles are stored
            fileExtension: '.json',     // JSON files
            articlesPerPage: 10,        
            snippetLength: 200,         
            cacheKey: 'blog_articles_cache',
            cacheTTL: 3600000          // 1 hour
        };

        // ═══════════════════════════════════════════════════════
        // CACHE
        // ═══════════════════════════════════════════════════════

        function getCachedArticles() {
            try {
                const cached = sessionStorage.getItem(BLOG_CONFIG.cacheKey);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < BLOG_CONFIG.cacheTTL) {
                        return parsed.data;
                    }
                }
            } catch (e) {}
            return null;
        }

        function cacheArticles(data) {
            try {
                sessionStorage.setItem(BLOG_CONFIG.cacheKey, JSON.stringify({
                    data: data,
                    timestamp: Date.now()
                }));
            } catch (e) {}
        }

        // ═══════════════════════════════════════════════════════
        // ARTICLE PARSING
        // ═══════════════════════════════════════════════════════

        function parseMarkdown(content) {
            const lines = content.split('\n');
            let title = '';
            let date = '';
            let tags = [];
            let body = [];
            let readingTime = 0;
            let inFrontMatter = false;
            let frontMatterCount = 0;

            // Check for frontmatter
            if (lines[0] && lines[0].trim() === '---') {
                inFrontMatter = true;
                frontMatterCount = 1;
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        inFrontMatter = false;
                        frontMatterCount = i + 1;
                        break;
                    }
                    
                    const line = lines[i];
                    if (line.startsWith('title:')) {
                        title = line.replace('title:', '').trim();
                    } else if (line.startsWith('date:')) {
                        date = line.replace('date:', '').trim();
                    } else if (line.startsWith('tags:')) {
                        tags = line.replace('tags:', '').trim().split(',').map(t => t.trim());
                    }
                }
            }

            // Get body (after frontmatter)
            body = lines.slice(frontMatterCount).join('\n');

            // Calculate reading time (approx 200 words per minute)
            const wordCount = body.split(/\s+/).length;
            readingTime = Math.max(1, Math.round(wordCount / 200));

            return { title, date, tags, body, readingTime };
        }

        function extractSnippet(content, length = 200) {
            const plainText = content.replace(/[#*`]/g, '').trim();
            if (plainText.length <= length) return plainText;
            return plainText.substring(0, length) + '...';
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return null;
            return date;
        }

        function formatDate(date) {
            if (!date) return '';
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function slugify(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // ═══════════════════════════════════════════════════════
        // RENDER FUNCTIONS
        // ═══════════════════════════════════════════════════════

        function renderArticleIndex(articles) {
            const container = document.getElementById('blog-container');
            const skeleton = document.getElementById('skeleton-loader');
            
            // Hide skeleton
            if (skeleton) skeleton.style.display = 'none';

            if (!articles || articles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <p class="text-gray-500 text-lg">No articles found.</p>
                        <p class="text-gray-400 text-sm mt-2">Check back later for new content.</p>
                        <a href="index.html" class="inline-block mt-6 text-indigo-600 hover:underline">← Return to homepage</a>
                    </div>
                `;
                return;
            }

            // Sort articles by date (newest first)
            const sorted = [...articles].sort((a, b) => {
                const dateA = parseDate(a.date);
                const dateB = parseDate(b.date);
                if (!dateA && !dateB) return 0;
                if (!dateA) return 1;
                if (!dateB) return -1;
                return dateB - dateA;
            });

            container.innerHTML = `
                <div class="space-y-8">
                    ${sorted.map(article => `
                        <article class="article-card bg-white rounded-xl p-6 md:p-8 shadow-sm hover:shadow-lg transition-all">
                            <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
                                <h2 class="text-xl md:text-2xl font-semibold text-gray-800 hover:text-indigo-600 transition">
                                    ${article.title}
                                </h2>
                                ${article.date ? `
                                    <span class="text-sm text-gray-400 whitespace-nowrap">
                                        ${formatDate(parseDate(article.date))}
                                    </span>
                                ` : ''}
                            </div>
                            
                            ${article.tags && article.tags.length > 0 ? `
                                <div class="flex flex-wrap gap-2 mb-3">
                                    ${article.tags.map(tag => `
                                        <span class="tag text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">
                                            #${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            <p class="text-gray-600 leading-relaxed mb-4">
                                ${extractSnippet(article.body, BLOG_CONFIG.snippetLength)}
                            </p>
                            
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <span class="text-sm text-gray-400">
                                    ${article.readingTime} min read
                                </span>
                                <button onclick="openArticle('${slugify(article.title)}')" 
                                        class="read-more text-indigo-600 font-medium hover:text-indigo-800 transition inline-flex items-center gap-1">
                                    Read more
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                    </svg>
                                </button>
                            </div>
                        </article>
                    `).join('')}
                </div>
            `;
        }

        function renderArticle(article, slug) {
            const container = document.getElementById('blog-container');
            const articleView = document.getElementById('article-view');
            const articleContent = document.getElementById('article-content');
            const skeleton = document.getElementById('skeleton-loader');

            // Hide skeleton and index
            if (skeleton) skeleton.style.display = 'none';
            if (container) container.style.display = 'none';
            articleView.classList.remove('hidden');

            // Convert markdown to HTML (simple implementation)
            let html = article.body;

            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

            // Bold and Italic
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Code blocks
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Blockquotes
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-600 hover:underline">$1</a>');

            // Lists (basic)
            html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^(\d+)\. (.*$)/gim, '<li>$2</li>');
            
            // Wrap lists
            html = html.replace(/<li>.*?<\/li>/gs, (match) => {
                if (match.includes('<li>')) {
                    return `<ul>${match}</ul>`;
                }
                return match;
            });

            // Paragraphs (simple)
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';

            // Clean up empty paragraphs
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(\s*)<h/g, '<h');
            html = html.replace(/<\/h(\d)><\/p>/g, '</h$1>');

            // Build article HTML
            articleContent.innerHTML = `
                <div class="mb-8">
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">${article.title}</h1>
                    <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500">
                        ${article.date ? `<span>${formatDate(parseDate(article.date))}</span>` : ''}
                        <span>${article.readingTime} min read</span>
                    </div>
                    ${article.tags && article.tags.length > 0 ? `
                        <div class="flex flex-wrap gap-2 mt-4">
                            ${article.tags.map(tag => `
                                <span class="tag text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full">
                                    #${tag}
                                </span>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
                <div class="prose max-w-none">
                    ${html}
                </div>
            `;

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Update URL
            if (window.history && window.history.pushState) {
                window.history.pushState({ slug }, '', `?article=${slug}`);
            }
        }

        function goBackToIndex() {
            const container = document.getElementById('blog-container');
            const articleView = document.getElementById('article-view');
            const skeleton = document.getElementById('skeleton-loader');

            articleView.classList.add('hidden');
            container.style.display = 'block';
            
            // Update URL
            if (window.history && window.history.pushState) {
                window.history.pushState({}, '', window.location.pathname);
            }

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ═══════════════════════════════════════════════════════
        // ARTICLE LOADING
        // ═══════════════════════════════════════════════════════

        const articleCache = {};

        function getArticleSlug(title) {
            return slugify(title);
        }

        async function loadArticle(slug) {
            // Check cache first
            if (articleCache[slug]) {
                renderArticle(articleCache[slug], slug);
                return;
            }

            try {
                // Try to find article in loaded articles
                const articles = getCachedArticles() || [];
                const article = articles.find(a => getArticleSlug(a.title) === slug);
                
                if (article) {
                    articleCache[slug] = article;
                    renderArticle(article, slug);
                    return;
                }

                // If not found, try to load from file
                const response = await fetch(`${BLOG_CONFIG.articlesPath}${slug}.json`);
                if (response.ok) {
                    const data = await response.json();
                    articleCache[slug] = data;
                    renderArticle(data, slug);
                    return;
                }

                throw new Error('Article not found');
            } catch (error) {
                console.error('Failed to load article:', error);
                const articleContent = document.getElementById('article-content');
                articleContent.innerHTML = `
                    <div class="text-center py-16">
                        <p class="text-gray-500 text-lg">Article not found</p>
                        <button onclick="goBackToIndex()" class="mt-4 text-indigo-600 hover:underline">
                            Return to blog
                        </button>
                    </div>
                `;
            }
        }

        function openArticle(slug) {
            loadArticle(slug);
        }

        // ═══════════════════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════════════════

        async function initBlog() {
            const container = document.getElementById('blog-container');
            const skeleton = document.getElementById('skeleton-loader');
            const articleView = document.getElementById('article-view');

            // Check for article in URL
            const urlParams = new URLSearchParams(window.location.search);
            const articleSlug = urlParams.get('article');

            if (articleSlug) {
                // Load specific article
                try {
                    const articles = getCachedArticles() || [];
                    const article = articles.find(a => getArticleSlug(a.title) === articleSlug);
                    
                    if (article) {
                        container.style.display = 'none';
                        articleView.classList.remove('hidden');
                        renderArticle(article, articleSlug);
                        return;
                    }
                } catch (e) {}
            }

            // Load articles from cache or fetch
            let articles = getCachedArticles();

            if (!articles) {
                try {
                    // Try to load articles from blog/index.json
                    const response = await fetch(`${BLOG_CONFIG.articlesPath}index.json`);
                    if (response.ok) {
                        articles = await response.json();
                        cacheArticles(articles);
                    } else {
                        // Fallback to sample data
                        articles = getSampleArticles();
                        cacheArticles(articles);
                    }
                } catch (error) {
                    console.warn('Failed to load articles, using sample data:', error);
                    articles = getSampleArticles();
                    cacheArticles(articles);
                }
            }

            renderArticleIndex(articles);

            // Handle browser back/forward
            window.addEventListener('popstate', (event) => {
                const urlParams = new URLSearchParams(window.location.search);
                const slug = urlParams.get('article');
                if (slug) {
                    loadArticle(slug);
                } else {
                    goBackToIndex();
                }
            });
        }

        // ═══════════════════════════════════════════════════════
        // SAMPLE ARTICLES (for demo - about the project)
        // ═══════════════════════════════════════════════════════

        function getSampleArticles() {
            return [
                {
                    title: "Building an Interactive CV with HTMX",
                    date: "2024-12-15",
                    tags: ["web-development", "htmx", "javascript", "project"],
                    readingTime: 5,
                    body: `
## Introduction

This project is an interactive, print-optimized CV built with HTMX and Tailwind CSS. The goal was to create a modern, engaging resume experience that stands out from traditional PDFs while being fast and accessible.

## Why HTMX?

HTMX allows you to build dynamic web applications without complex JavaScript frameworks. It lets you access AJAX, CSS transitions, WebSockets, and more directly from HTML attributes, making it perfect for a lightweight project like this.

## Key Features

The interactive CV includes:

- **Collapsible sections** - Click to expand/collapse experience, projects, and skills
- **Multi-language support** - Toggle between Portuguese and English
- **Print optimization** - Clean, professional output for printing
- **Instant copy** - Click contact info to copy to clipboard

## Technical Implementation

The core of the interactivity is powered by HTMX's hx-trigger and hx-swap attributes. For example, clicking a section title triggers a GET request that returns the expanded content.

### Performance

With minimal dependencies and no build process, the CV loads instantly and scores 96+ on Lighthouse performance tests.

## Project Structure

\`\`\`
project/
├── index.html      # Landing page
├── cv.html         # Interactive CV (Portuguese)
├── cv_pt.html      # Interactive CV (English)
├── blog.html       # Blog page
└── blog/           # Blog articles
    └── index.json  # Article index
\`\`\`

## Conclusion

Building an interactive CV with HTMX is a great way to showcase technical skills while providing a unique user experience. The result is both functional and impressive to potential employers.
                    `
                },
                {
                    title: "Secure Testimonials Without a Database",
                    date: "2024-12-10",
                    tags: ["security", "javascript", "performance", "project"],
                    readingTime: 4,
                    body: `
## Introduction

Adding testimonials to your website doesn't require a complex database setup. In this project, I implemented secure, performant testimonials using pure HTML, CSS, and JavaScript.

## Security First

Security is paramount when handling user-generated content. Our implementation includes:

- **Content Security Policy (CSP)** headers
- **Data encryption** at rest
- **Integrity verification** on load
- **XSS prevention** with sanitization
- **eval() blocking**

## Performance Optimizations

The testimonials system is built with performance in mind:

- **Lazy loading** with Intersection Observer
- **Skeleton loading** for better UX
- **DOM batching** with DocumentFragment
- **Session caching** for repeat visits
- **RequestAnimationFrame** for smooth rendering

## Implementation

The entire system is contained in a single HTML file with no external dependencies. Testimonials are stored in a JavaScript array that's encrypted and integrity-checked.

## Code Example
